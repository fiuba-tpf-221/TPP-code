services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: perfilado
      POSTGRES_USER: tpp
      POSTGRES_PASSWORD: tpp

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tpp -d perfilado"
        ]
      interval: 3s
      timeout: 3s
      retries: 15

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro


  redis:
    image: redis:7

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 3s
      timeout: 3s
      retries: 15


  tests:
    build:
      context: ..
      dockerfile: Dockerfile

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: perfilado
      POSTGRES_USER: tpp
      POSTGRES_PASSWORD: tpp

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "pytest",
        "-vv",
        "-s",
        "tests/smoke/test_infrastructure.py"
      ]


volumes:
  postgres_data: