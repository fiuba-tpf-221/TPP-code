services:
  # Base de Datos Relacional + Geoespacial (PostGIS)
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Message Broker Asíncrono (Tareas pesadas de ML y procesamientos)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: app_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel Web de Administración
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  # Caché exclusiva para Keycloak
  redis_keycloak:
    image: redis:alpine
    container_name: app_redis_keycloak
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    volumes:
      - redis_keycloak_data:/data
      - ./keycloak/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro

  # Object Storage S3 (Archivos .SEGY, .LAS y artefactos ML)
  minio:
    image: coollabsio/minio:latest
    container_name: app_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9002:9000"   # API S3
      - "9001:9001"   # Consola Web
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data



  minio-setup:
    image: python:3-alpine
    container_name: app_minio_setup
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir minio > /dev/null 2>&1
        python -c "
        import time
        from minio import Minio

        client = Minio('minio:9000', access_key='minioadmin', secret_key='minioadminpassword', secure=False)

        print('Esperando a que MinIO esté en línea...')
        for i in range(30):
            try:
                if not client.bucket_exists('tpp-bucket'):
                    client.make_bucket('tpp-bucket')
                print('¡Bucket tpp-bucket creado correctamente!')
                break
            except Exception as e:
                time.sleep(2)
        "


  # Identity Provider & SSO (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: app_keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/appdb
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false" # Apaga la validación global de HTTPS
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - postgres
      - redis_keycloak

  keycloak-setup:
    image: quay.io/keycloak/keycloak:latest
    container_name: app_keycloak_setup
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - |
        echo 'Esperando a que Keycloak acepte conexiones...'
        while ! /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password admin > /dev/null 2>&1; do
          echo 'Keycloak no está listo aún. Reintentando en 3 segundos...'
          sleep 3
        done
        echo '¡Keycloak online! Apagando SSL estricto...'
        /opt/keycloak/bin/kcadm.sh update realms/tpp-realm -s sslRequired=NONE
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
        echo '¡Listo! Entorno configurado de forma segura.'

  # Trazado Distribuido (Jaeger)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: app_jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SAMPLING_STRATEGIES_FILE=/etc/jaeger/sampling.json
    ports:
      - "16686:16686" # UI Web
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./jaeger/sampling.json:/etc/jaeger/sampling.json:ro

  # Colector Telemetría (OpenTelemetry)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: app_otel_collector
    restart: always
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "1888:1888"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger

  # Backend (FastAPI / Python)
  backend:
    build: ./backend
    container_name: app_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/appdb
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - otel-collector

  # Frontend (ReactJS)
  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Proxy Reverso / API Gateway
  nginx:
    image: nginx:alpine
    container_name: app_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # Monitoreo (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: app_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Métricas de Contenedores (cAdvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: app_cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # Dashboards de Visualización (Grafana)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: app_grafana
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources

  # Calidad y Estática de Código (SonarQube)
  sonarqube:
    image: sonarqube:community
    container_name: app_sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

volumes:
  postgres_data:
  rabbitmq_data:
  redis_keycloak_data:
  minio_data:
