server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rutas de React Router (/usuarios, /login, ...): siempre se responde con index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea: una versión nueva se ve apenas se recarga
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash en el nombre: se pueden cachear por mucho tiempo
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
