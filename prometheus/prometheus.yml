global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'tpp-monitoring'
    static_configs:
      - targets: ['host.docker.internal:3002']

  - job_name: 'otel-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
